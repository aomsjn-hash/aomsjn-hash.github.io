<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Information Collection</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Pet Information Form</h1>
        <form id="pet-info-form">
            <label for="pet-name">Pet Name:</label>
            <input type="text" id="pet-name" name="pet-name" required>

            <label for="pet-type">Pet Type:</label>
            <input type="text" id="pet-type" name="pet-type" required>

            <label for="pet-age">Pet Age:</label>
            <input type="number" id="pet-age" name="pet-age" required>

            <label for="pet-notes">Additional Notes:</label>
            <textarea id="pet-notes" name="pet-notes"></textarea>

            <button type="submit">Submit</button>
        </form>
        <div id="pet-info-display"></div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
